<section class="section">
  <div class="container">
    <div class="section-head">
      <h2 class="section-title">最新消息</h2>
      <button type="button" class="section-more">查看更多 →</button>
    </div>
    <div class="grid">
      @for (item of news; track item.id) {
        <app-news-card [item]="item" />
      }
    </div>
  </div>
</section>
